<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify - Gestión de Tareas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 dark:bg-slate-900 min-h-screen font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">

    <div id="auth-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">🚀 Taskify</h1>
                <button id="theme-toggle-auth" class="p-2 rounded-lg bg-gray-100 dark:bg-slate-700 text-lg">🌙</button>
            </div>
            <p class="text-gray-500 dark:text-gray-400 mb-6 text-sm">Organiza tus tareas de forma simple y eficiente</p>

            <form id="login-form" class="space-y-4">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">Iniciar Sesión</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                    <input type="email" id="login-email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:bg-slate-700 dark:border-gray-600 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:bg-slate-700 dark:border-gray-600 dark:text-white">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Ingresar</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    <a href="#" id="toggle-auth" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">¿No tienes cuenta? Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <header class="bg-indigo-600 dark:bg-slate-800 text-white shadow-lg border-b dark:border-gray-700">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold flex items-center gap-2">🚀 Taskify</h1>
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="p-1.5 rounded-lg bg-indigo-700 dark:bg-slate-700 hover:opacity-80 transition text-base">🌙</button>
                    <span id="user-email-display" class="text-xs bg-indigo-700 dark:bg-slate-700 px-3 py-1 rounded-full"></span>
                    <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg transition">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto w-full px-4 py-8 flex-1 space-y-8">
            <section class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-200">✍️ Nueva Tarea</h2>
                <form id="create-task-form" class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="task-title" placeholder="¿Qué tienes pendiente hoy?" required class="flex-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:bg-slate-700 dark:border-gray-600 dark:text-white">
                    
                    <select id="task-priority" class="p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white dark:bg-slate-700 dark:border-gray-600 dark:text-white">
                        <option value="BAJA">Prioridad Baja 🟢</option>
                        <option value="MEDIA" selected>Prioridad Media 🟡</option>
                        <option value="ALTA">Prioridad Alta 🔴</option>
                    </select>

                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition">Agregar</button>
                </form>
            </section>

            <div class="grid md:grid-cols-2 gap-8">
                <section class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 flex items-center justify-between text-gray-800 dark:text-gray-100">
                        <span>📋 Tareas Pendientes</span>
                        <span id="pending-count" class="text-sm bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 px-2.5 py-0.5 rounded-full">0</span>
                    </h2>
                    <ul id="pending-tasks-list" class="space-y-3"></ul>
                </section>

                <section class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4 flex items-center justify-between text-gray-800 dark:text-gray-100">
                        <span>📜 Historial (30 días)</span>
                        <span id="history-count" class="text-sm bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300 px-2.5 py-0.5 rounded-full">0</span>
                    </h2>
                    <ul id="history-tasks-list" class="space-y-3"></ul>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
